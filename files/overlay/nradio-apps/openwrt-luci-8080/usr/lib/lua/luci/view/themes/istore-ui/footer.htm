	local http = require "luci.http"

	local _packages = _req:find("/admin/system/packages", 1, true)
	-- 实时负载页：卡片化图表/指标并注入 SVG 文档样式
	local _realtime = _req:find("/admin/status/realtime", 1, true)
	-- DHCP/DNS 页：按要求放开一屏，改为自然滚动 + 卡片化重排
	local _dhcp = _req:find("/admin/network/dhcp", 1, true)
	-- 短内容页（进程/路由/计划任务/日志/重启/诊断等）：统一空态与留白。
	-- 只列内容量很小的 CBI 短页，排除已有专用层的页面，避免样式叠加。
	local _short = false
	for _, p in ipairs({
		"/admin/status/processes", "/admin/status/syslog", "/admin/status/dmesg",
		"/admin/network/routes", "/admin/network/diagnostics",
		"/admin/system/crontab", "/admin/system/reboot", "/admin/system/reset",
		"/admin/system/security", "/admin/system/autotimeset", "/admin/system/flashops"
	}) do
		if _req:find(p, 1, true) then _short = true break end
	end

	local function qs_has_embed()
		local qs = http.getenv("QUERY_STRING") or ""
		if qs == "" then return false end
		for pair in (qs .. "&"):gmatch("([^&]*)&") do
			if pair == "_embed=1" then return true end
		end
		return false
	end
	local embed = (tostring(http.getenv("SERVER_PORT") or "") == "8080")
		and (qs_has_embed() or tostring(http.getcookie("ios_embed") or "") == "1")

	if embed then

<script>
/* 嵌入态：脱壳保护 + 内部链接/表单保持 _embed + 向父窗口回报状态 */
(function () {
	'use strict';
	function stripEmbed(u) {
		return String(u || '').replace(/([?&])_embed=1(?=&|$)/, '$1').replace(/[?&]$/, '');
	}
	/* 不在 iframe 内却被直接打开（复制了带 _embed 的地址）→ 回到完整页，避免残缺骨架 */
	if (window.top === window) {
		try { location.replace(stripEmbed(location.href)); return; } catch (e) {}
	}
	function withEmbed(u) {
		if (!u || u.indexOf('/cgi-bin/luci/') !== 0) return u;
		if (u.indexOf('_embed=1') >= 0) return u;
		return u + (u.indexOf('?') >= 0 ? '&' : '?') + '_embed=1';
	}
	document.addEventListener('click', function (ev) {
		if (ev.defaultPrevented || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button !== 0) return;
		var a = ev.target;
		while (a && a.tagName !== 'A') a = a.parentNode;
		if (!a) return;
		if (a.target && a.target !== '_self') return;
		var href = a.getAttribute('href') || '';
		if (!href || href.charAt(0) === '#' || /^(javascript|mailto|tel):/i.test(href)) return;
		var u;
		try { u = new URL(a.href); } catch (e) { return; }
		if (u.origin !== location.origin) return;
		if (u.pathname.indexOf('/cgi-bin/luci/') !== 0) return;
		ev.preventDefault();
		location.href = withEmbed(u.pathname + u.search + u.hash);
	}, true);
	document.addEventListener('submit', function (ev) {
		var f = ev.target;
		if (!f || !f.getAttribute) return;
		var act = f.getAttribute('action') || location.pathname;
		if (act.indexOf('/cgi-bin/luci/') === 0) {
			var next = withEmbed(act);
			if (next !== act) f.setAttribute('action', next);
		}
	}, true);
	function post(type, extra) {
		var msg = { type: type, url: location.pathname + location.search, title: document.title };
		if (extra) for (var k in extra) { if (extra.hasOwnProperty(k)) msg[k] = extra[k]; }
		try { window.parent.postMessage(msg, '*'); } catch (e) {}
	}
	function ready() { post('ready'); }
	if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ready);
	else ready();
	window.addEventListener('load', ready);
	window.addEventListener('beforeunload', function () { post('leave'); });
	window.iosEmbedPost = post;
})();
</script>
<script>

	});
	Array.prototype.forEach.call(document.querySelectorAll('#maincontent .cbi-section'), function (s) {
		s.classList.add('ios-card');
	});
})();
</script>
